# Example warp config. Copy to ~/.config/warp/config.toml (or run `warp init`)
# and edit to match your hosts.

[binaries]                     # optional; omit an entry to resolve it via $PATH
ssh       = "/usr/bin/ssh"
mosh      = "/usr/bin/mosh"
et        = "/usr/local/bin/et"
tailscale = "/usr/bin/tailscale"
tsh       = "/usr/local/bin/tsh"
telnet    = "/usr/bin/telnet"

[defaults]                     # shared by all protocols unless overridden below
user = "alice"
identity_file = "~/.ssh/id_ed25519"
port = 22
compression = true
# multiplex_persist = "5m"      # keep warp's own ssh ControlMaster connection alive
                                # for this long after Connect finishes (a Go duration
                                # string), instead of tearing it down immediately.
                                # warp always establishes its own ControlMaster
                                # connection before the first ssh/mosh attempt for a
                                # host, so a mosh failure (e.g. mosh-server missing on
                                # the remote) can fall through to ssh without a second
                                # auth prompt -- this doesn't depend on mosh's own
                                # aborted bootstrap leaving behind a usable socket,
                                # which it doesn't reliably do.

[host.myserver]
addresses = ["myserver.example.com", "10.0.0.5", "192.168.1.5"]  # tried in order
aliases = ["ms", "myserver-prod"]      # `warp connect ms` also resolves here
protocol = ["mosh", "ssh"]             # try mosh first, fall back to ssh
user = "bob"                           # overrides [defaults] for this host, all protocols

[host.myserver.ssh]                    # ssh-only overrides for this host
port_forwarding = ["8080:localhost:80"]
proxy_jump = "bastion"
control_master = true
# extra_args = ["-o", "SomeFutureOption=yes"]   # escape hatch for anything not modeled

[host.myserver.mosh]
predict = "adaptive"
udp_port_range = "60000:61000"
ssh_port = 2222

[host.sshonly]
addresses = "sshonly.example.com"      # bare string is fine when there's only one
protocol = "ssh"                       # explicit single protocol, no fallback

[host.sshonly.et]                      # not used unless protocol includes "et"
port = 2022
jumphost = "bastion.example.com"
ssh_forwarding = false
keepalive = true

[host.noproto]
# No `protocol` set at all here, so warp uses its built-in default order:
#   et -> mosh -> ssh -> tailscale -> tsh -> telnet
# et/mosh both bootstrap over ssh, so if a host only actually runs sshd,
# those attempts fail before any auth prompt and you land on plain ssh
# having authenticated exactly once. tailscale/tsh use a separate identity
# (your tailnet login / Teleport cluster login) instead of ssh keys. telnet
# is tried last, as an unencrypted last resort.
addresses = "noproto.example.com"

[host.tailnet-box]
addresses = "tailnet-box"              # tailscale hosts are addressed by name
protocol = "tailscale"

[host.tailnet-box.tailscale]
# socket = "/custom/tailscaled.sock"   # per-host override; see [tailscale] below for the usual case

[host.teleport-box]
addresses = "teleport-box.example.com"
protocol = "tsh"

[host.teleport-box.tsh]
cluster = "prod.example.com"
proxy = "teleport.example.com:443"

[host.old-switch]
addresses = "old-switch.example.com"
protocol = "telnet"                    # e.g. legacy network gear with no ssh support

[host.old-switch.telnet]
port = 23

# `warp --scan` probes subnets for hosts speaking ssh/et/telnet, plus your
# Tailscale peers (found via `tailscale status`, not a port scan). With no
# --subnet flag on the CLI, it uses [scan].subnets below; with neither, it
# auto-detects subnets from your local network interfaces.
[scan]
subnets = ["192.168.1.0/24"]
# workers = 256                        # optional; concurrency cap, default 256

# Machine-wide default for `tailscale ssh`/`tailscale status`, e.g. when
# tailscaled listens on a non-default control socket (custom install,
# container, multiple tailscaled instances). Overridden per host via
# [host.X.tailscale] socket, as shown above for tailnet-box.
[tailscale]
# socket = "/var/run/tailscale/tailscaled.sock"

# Auto-import hosts/credentials from config files ssh/mosh/et/telnet
# already understand, so you don't have to duplicate entries that already
# exist there. Both default to *enabled*, reading the paths shown below,
# even with no [sources] section at all -- an explicit [host.X] here
# always wins outright over anything sourced; sourced hosts are strictly
# lower priority, never merged field-by-field.
[sources.ssh_config]
# enabled = true                       # set false to disable entirely
# paths = ["~/.ssh/config"]            # default; mosh (bootstraps over ssh)
                                        # and et (parses ssh_config itself)
                                        # both benefit from this too

[sources.netrc]
# enabled = true                       # set false to disable entirely
# paths = ["~/.netrc"]                 # default
# Enables telnet's own -a autologin for a host whose address matches a
# ~/.netrc machine entry, and fills in [host.X.telnet] user from its login
# field if not already set. warp itself never reads the password -- telnet
# re-reads ~/.netrc on its own when given -a.
