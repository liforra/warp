name: release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: |
          base="$(tr -d ' \t\n\r' < VERSION)"
          sha="$(git rev-parse --short=7 HEAD)"
          echo "tag=v${base}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        # GoReleaser validates that its current tag actually exists and
        # points at HEAD before it will release -- GORELEASER_CURRENT_TAG
        # alone doesn't create one, it just picks which existing tag to
        # use. actions/checkout already leaves the repo authenticated for
        # push via GITHUB_TOKEN (contents: write, set above).
        run: |
          tag="${{ steps.version.outputs.tag }}"
          git tag "$tag"
          git push origin "$tag"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
