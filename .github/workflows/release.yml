name: release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: |
          base="$(tr -d ' \t\n\r' < VERSION)"
          sha="$(git rev-parse --short=7 HEAD)"
          echo "tag=v${base}-${sha}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lets GoReleaser build/tag this release as v<VERSION>-<sha>
          # without requiring an actual annotated git tag to exist first;
          # GitHub creates the underlying tag when the release is published.
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
